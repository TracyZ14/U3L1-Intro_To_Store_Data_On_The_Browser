<!DOCTYPE html>
<html>
	<head>
		  <script src = "https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"> </script>
	</head>

	<body>
		<h2>How many times have you visited this site?</h2>
		<p id = visits></p>
		
		<script>
            let visits = document.getElementById("visits");

            let timesVisited = localStorage.getItem("timesVisited");

            if(timesVisited == null) {
                timesVisited = 0;
            } else {
                timesVisited = parseInt(timesVisited, 10);
            }

            timesVisited++;

            localStorage.setItem("timesVisited", timesVisited);

            visits.innerHTML = timesVisited;
		</script>
	</body>
</html>
