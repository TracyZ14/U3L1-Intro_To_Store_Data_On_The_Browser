<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2 id="average-score">Average Score:</h2>

    <h2 id="maximum-score">Maximum Score:</h2>

    <h2 id="minimum-score">Minimum Score:</h2>

    <button onclick="newScore()">New Score</button>

    <script>
        let listOfScores = [20, 45, 10, 344];

        let scores = localStorage.getItem("scores");

        if(scores == null) {
            scores = listOfScores;
        } else {
            scores = scores.split(",").map(Number);
        }

        localStorage.setItem("scores", scores);

        let averageScore = document.getElementById("average-score");
        let maximumScore = document.getElementById("maximum-score");
        let minimumScore = document.getElementById("minimum-score");

        function newScore() {
            let score = prompt("What is your new score?");

            scores.push(parseInt(score, 10));

            updateScores();
        }

        function updateScores() {
            let average = scores[0];
            let maximum = scores[0];
            let minimum = scores[0];

            for(let i = 0; i < scores.length; i++) {
                if(i != 0) {
                    average = average + scores[i];

                    if(scores[i] > maximum) {
                        maximum = scores[i];
                    }

                    if(scores[i] < minimum) {
                        minimum = scores[i];
                    }
                }
            }

            average = Math.round(average / scores.length);

            averageScore.innerHTML = "Average Score: " + average;
            maximumScore.innerHTML = "Maximum Score: " + maximum;
            minimumScore.innerHTML = "Minimum Score: " + minimum;

            localStorage.setItem("scores", scores);
        }

        updateScores();
    </script>
</body>
</html>
